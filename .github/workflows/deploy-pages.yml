name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Push the Docusaurus `build/` output to the `gh-pages` branch.
# Pages must use: Settings → Pages → Deploy from a branch → gh-pages / (root)
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run sync:config
      - name: Ensure generated docs are committed
        run: |
          if ! git diff --quiet -- docs/Install/Configuration.md; then
            echo "::error::docs/Install/Configuration.md is out of date. Run npm run sync:config and commit."
            git --no-pager diff -- docs/Install/Configuration.md
            exit 1
          fi
      - run: npm run build
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          force_orphan: true

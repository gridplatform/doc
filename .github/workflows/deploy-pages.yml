name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publish Docusaurus build → gh-pages, then point GitHub Pages at that branch.
permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run sync:config
      - name: Ensure generated docs are committed
        run: |
          if ! git diff --quiet -- docs/Install/Configuration.md; then
            echo "::error::docs/Install/Configuration.md is out of date. Run npm run sync:config and commit."
            git --no-pager diff -- docs/Install/Configuration.md
            exit 1
          fi
      - run: npm run build
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          force_orphan: true
      - name: Point GitHub Pages at gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Prefer branch deploy of the Docusaurus build (not Jekyll on main).
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" \
              -H "Accept: application/vnd.github+json" \
              -f build_type=legacy \
              -f source[branch]=gh-pages \
              -f source[path]=/
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" \
              -H "Accept: application/vnd.github+json" \
              -f build_type=legacy \
              -f source[branch]=gh-pages \
              -f source[path]=/
          fi
          echo "Pages source set to gh-pages /"
          gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '{build_type,status,html_url,source}'
